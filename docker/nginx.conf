# 靜態 SPA + 反代 API。SSE 經此不得緩衝（主規格 §10.3、前端設計 §2.5）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 每次請求向 Docker 內建 DNS 解析 api：api 容器重建換了 IP 也不會 502，
    # nginx 啟動時 api 還沒起來也不會失敗
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # /api/*、/health、/swagger/* 原路徑轉給 api（proxy_pass 用變數且不帶 URI：原樣轉送請求路徑）
    location ~ ^/(api|health|swagger)(/|$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        # 單輪上限 120 秒（Orchestrator:TurnTimeoutSeconds），留退避空間
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ssr: false 的 SPA：任何路徑重載都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
