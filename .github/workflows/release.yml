name: Release

# 推 v* tag（例如 v0.1.0）就建一個程式版本的 Release；
# 或在 Actions 頁手動執行並填版本號，由 workflow 在所選分支的最新 commit 上打 tag。
# 知識庫種子另走 seed-v* tag、由 scripts/export_seed.py 印出的指令手動上傳，不經過這裡。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本 tag，例如 v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 手動執行時先打 tag 並推上去；GITHUB_TOKEN 推的 tag 不會再觸發一次這個 workflow
      - name: tag the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v*) ;; *) echo "tag 要以 v 開頭：$TAG"; exit 1 ;; esac
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在"; exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      # 變更摘要：上一個 v* tag 到這個 tag 之間主線（first-parent）上的 commit，
      # 主線多半是 merge commit，訊息本身就是一段中文摘要。第一版則列出全部主線歷史。
      - name: build release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          range=${prev:+${prev}..}${TAG}
          {
            if [ -n "$prev" ]; then
              echo "## ${prev} 之後的變更"
            else
              echo "## 變更"
            fi
            echo
            git log --first-parent --format='- %s (%h)' "$range"
            echo
            echo "知識庫種子不隨程式版本發布，見 seed-v* Release；\`docker-compose.yml\` 的 \`SEED_URL\` 指向目前使用的那一版。"
          } > notes.md
          cat notes.md

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
